<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticketera ECC - por Raúl :)</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar el parpadeo claro/oscuro.
      (function () {
        try {
          var t = localStorage.getItem("ticketera-tema");
          var sistema = t !== "claro" && t !== "oscuro";
          var oscuro = t === "oscuro" || (sistema && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (oscuro) document.documentElement.classList.add("dark");
        } catch (e) { /* sin acceso a localStorage: se usa el tema claro */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
